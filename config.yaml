# All project parameters live here. Change values here, not in code.
# Bloomberg tickers and OptionMetrics identifiers are from memory:
# verify each on the terminal / WRDS before the first pull.

sample:
  start: "2012-01-01"
  end: null            # null = latest available

# Releases traded. To add one, add an entry.
#   family:   inflation | labor | activity | policy
#   bbg:      Bloomberg economic calendar ticker
#   time_et:  scheduled release time, US Eastern
#   anchor_series: FRED series whose release supplies the dates
#                  (release ID is looked up from the series)
#   first_release_after_quarter_end: keep only the first release date
#                  after each quarter ends (GDP advance estimate)
events:
  cpi:
    family: inflation
    anchor_series: CPIAUCSL
    bbg: "CPI CHNG Index"
    time_et: "08:30"
  pce:
    family: inflation
    anchor_series: PCEPI
    bbg: "PCE CMOM Index"
    time_et: "08:30"
  payrolls:
    family: labor
    anchor_series: PAYEMS
    bbg: "NFP TCH Index"
    time_et: "08:30"
  jolts:
    family: labor
    anchor_series: JTSJOL
    bbg: "JOLTTOTL Index"
    time_et: "10:00"
  gdp:
    family: activity
    anchor_series: GDPC1
    bbg: "GDP CQOQ Index"
    time_et: "08:30"
    first_release_after_quarter_end: true   # advance estimate only
  retail_sales:
    family: activity
    anchor_series: RSAFS
    bbg: "RSTAMOM Index"
    time_et: "08:30"
  fomc:
    family: policy
    bbg: "FDTR Index"
    time_et: "14:00"

# A release on a date the stock market is closed (e.g. payrolls on Good
# Friday) is assigned to the next trading date, the first close that can
# react to it. The original date is kept in the release_date column.
#   next_trading_day | drop
non_trading_day_releases: next_trading_day

